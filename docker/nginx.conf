server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 512;

    charset utf-8;

    # صفحات HTML: کش کوتاه تا آپدیت‌های محتوا سریع دیده شوند
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # CSS/JS: کش متوسط
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # sitemap/robots
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Playground محلی → gate → von (docker-compose؛ هیچ‌کدام ports:
    # منتشرشده ندارند، فقط از همین nginx در دسترس‌اند). Origin باید روی
    # همین دامنه باشد — بدون استثنای «Origin خالی مجاز است»، چون
    # Postman/curl/httpie به‌صورت پیش‌فرض اصلاً هدر Origin نمی‌فرستند و
    # همان استثنا راه دورزدن این چک بود. مرورگرها برای هر fetch با متد
    # POST (even هم‌دامنه) همیشه Origin می‌فرستند، پس این قانون درخواست
    # واقعی صفحه را رد نمی‌کند.
    # نکته‌ی مهم: طرح‌واره (scheme) عمداً چک نمی‌شود، فقط میزبان — و این
    # چک با دو خط "=" ساده (نه regex) نوشته شده. این nginx خودش TLS
    # ندارد (پشت ArvanCloud/nginx سیستم هاست است که
    # docker/reverse-proxy.jevhub.ir.conf توضیح می‌دهد)، پس $scheme
    # این‌جا همیشه http است حتی وقتی کاربر روی https بوده؛ نسخه‌ی قبلی
    # این چک یا مستقیم با "$scheme://$http_host" مقایسه می‌کرد (که چون
    # $scheme همیشه http بود، Origin واقعیِ https مرورگر هرگز match
    # نمی‌شد) یا با یک الگوی regex نوشته شده بود که وضعیتش بدتر بود:
    # nginx متغیرها را داخل الگوی regex اصلاً substitute نمی‌کند (رجکس‌ها
    # در nginx یک‌بار و در زمان استارت کامپایل می‌شوند)، پس آن رجکس
    # همیشه رشته‌ی خام "$http_host" را می‌جست و هیچ‌وقت match نمی‌کرد.
    # هر دو حالت باعث ۴۰۳ همیشگی روی /api/von/ می‌شدند و فرانت‌اند
    # (assets/js/playground.js) این ۴۰۳ را «Von در دسترس نیست» نشان
    # می‌داد — یعنی آن پیام اصلاً ربطی به سالم‌بودن von/gate نداشت.
    # راه‌حل درست: مقایسه‌ی رشته‌ای ساده‌ی "=" (که substitution متغیر را
    # پشتیبانی می‌کند، برخلاف "~"/"!~") در برابر هر دو طرح‌واره.
    # نرخ‌محدودسازی و کپچا (وقتی لازم شود) داخل خودِ gate انجام می‌شود
    # (docker/gate/app.py)؛ این‌جا فقط جلوی صداکردن مستقیم از بیرون را
    # می‌گیریم — نه یک محافظت قطعی (هدر قابل‌جعل است)، دفاع اصلی همان
    # publish‌نشدنِ پورت gate/von است.
    location /api/von/ {
        set $von_origin_ok 0;
        if ($http_origin = "https://$http_host") { set $von_origin_ok 1; }
        if ($http_origin = "http://$http_host") { set $von_origin_ok 1; }
        if ($von_origin_ok = 0) { return 403; }

        proxy_pass http://gate:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
