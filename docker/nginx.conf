server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 512;

    charset utf-8;

    # صفحات HTML: کش کوتاه تا آپدیت‌های محتوا سریع دیده شوند
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # CSS/JS: کش متوسط
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # sitemap/robots
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Playground محلی → سرویس Von (docker-compose، بدون ports: منتشرشده،
    # فقط از همین nginx در دسترس است). Origin/Referer را با $http_host
    # (میزبان همین درخواست) مقایسه می‌کنیم تا فقط fetchهای خودِ سایت از
    # مرورگر رد شوند — نه یک محافظت قطعی (curl می‌تواند هدر جعل کند)، اما
    # از embed شدن در سایت‌های دیگر یا صدا زدن مستقیم مانع می‌شود؛
    # محافظت اصلی همان publish‌نشدنِ پورت سرویس von است.
    location /api/von/ {
        set $von_origin_ok 0;
        if ($http_origin = "$scheme://$http_host") { set $von_origin_ok 1; }
        if ($http_origin = "") { set $von_origin_ok 1; }
        if ($von_origin_ok = 0) { return 403; }

        proxy_pass http://von:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
