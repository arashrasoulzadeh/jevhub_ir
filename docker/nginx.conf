server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 512;

    charset utf-8;

    # صفحات HTML: کش کوتاه تا آپدیت‌های محتوا سریع دیده شوند
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # CSS/JS: کش متوسط
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # sitemap/robots
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Playground محلی → gate → von (docker-compose؛ هیچ‌کدام ports:
    # منتشرشده ندارند، فقط از همین nginx در دسترس‌اند). Origin باید
    # دقیقاً همین دامنه باشد — بدون استثنای «Origin خالی مجاز است»،
    # چون Postman/curl/httpie به‌صورت پیش‌فرض اصلاً هدر Origin
    # نمی‌فرستند و همان استثنا راه دورزدن این چک بود. مرورگرها برای هر
    # fetch با متد POST (even هم‌دامنه) همیشه Origin می‌فرستند، پس این
    # قانون درخواست واقعی صفحه را رد نمی‌کند.
    # نرخ‌محدودسازی و کپچا (وقتی لازم شود) داخل خودِ gate انجام می‌شود
    # (docker/gate/app.py)؛ این‌جا فقط جلوی صداکردن مستقیم از بیرون را
    # می‌گیریم — نه یک محافظت قطعی (هدر قابل‌جعل است)، دفاع اصلی همان
    # publish‌نشدنِ پورت gate/von است.
    location /api/von/ {
        if ($http_origin != "$scheme://$http_host") { return 403; }

        proxy_pass http://gate:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
