# کانفیگ nginx سیستم (نه داخل کانتینر) برای reverse proxy به کانتینر jevhub.
# مقصد: /etc/nginx/sites-available/jevhub.ir روی همان سرور Ubuntu.
#
# نصب:
#   sudo cp docker/reverse-proxy.jevhub.ir.conf /etc/nginx/sites-available/jevhub.ir
#   sudo ln -s /etc/nginx/sites-available/jevhub.ir /etc/nginx/sites-enabled/jevhub.ir
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d jevhub.ir -d www.jevhub.ir   # گواهی HTTPS را می‌سازد
#                                                          # و این فایل را خودش برای HTTPS به‌روز می‌کند
#
# پیش‌نیاز: کانتینر jevhub با docker compose بالا باشد و روی
# 127.0.0.1:${APP_PORT} (پیش‌فرض 8088) گوش بدهد — همان‌طور که در
# docker-compose.yml این پروژه تنظیم شده.

upstream jevhub_upstream {
    server 127.0.0.1:8088;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name jevhub.ir www.jevhub.ir;

    location / {
        proxy_pass http://jevhub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
