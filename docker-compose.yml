services:
  jevhub:
    build: .
    image: jevhub:latest
    container_name: jevhub
    depends_on:
      - gate
    ports:
      # فقط روی لوپ‌بک باز می‌شود — nginx سیستم (پورت ۸۰/۴۴۳) reverse proxy
      # است و به همین پورت وصل می‌شود؛ کانتینر مستقیم به اینترنت expose نمی‌شود.
      # APP_PORT از .env می‌آید؛ با `ss -ltn` قبل از اجرا آزاد بودنش را چک کنید.
      - "127.0.0.1:${APP_PORT:-8088}:80"
    restart: unless-stopped

  # دروازه‌ی نرخ‌محدودسازی/کپچا جلوی von (docker/gate/). بدون "ports:"؛
  # فقط nginx کانتینر jevhub آن را صدا می‌زند (location /api/von/).
  # ARCAPTCHA_SITE_KEY / ARCAPTCHA_SECRET_KEY از .env می‌آیند (arcaptcha.ir —
  # نه Cloudflare Turnstile، چون این پروژه روی ArvanCloud میزبانی می‌شود)؛
  # هر دو را خالی بگذارید تا کپچا غیرفعال بماند (فقط نرخ‌محدودسازی + چک
  # Origin در nginx فعال می‌مانند).
  gate:
    build: ./docker/gate
    image: jevhub-gate:latest
    container_name: jevhub-gate
    depends_on:
      - von
    environment:
      VON_URL: http://von:8000
      ARCAPTCHA_SITE_KEY: ${ARCAPTCHA_SITE_KEY:-}
      ARCAPTCHA_SECRET_KEY: ${ARCAPTCHA_SECRET_KEY:-}
    restart: unless-stopped

  # مدل Von برای Playground (docs/similar-models.html، جدول جایگزین‌ها).
  # عمداً هیچ "ports:" ندارد — یعنی هیچ آدرسی روی هاست/اینترنت باز نمی‌شود؛
  # فقط از داخل شبکه‌ی این docker-compose، با نام سرویس (von:8000)، توسط
  # سرویس gate قابل‌دسترسی است.
  von:
    build: ./docker/von
    image: jevhub-von:latest
    container_name: jevhub-von
    volumes:
      # وزن‌های ~1.5GB مدل را کش می‌کند تا با هر `up --build` دوباره
      # دانلود نشوند؛ فقط بار اول که کانتینر بالا می‌آید طول می‌کشد.
      - von-hf-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  von-hf-cache:
